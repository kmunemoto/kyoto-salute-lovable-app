name: Weekly blog post

# Generates one new SEO blog article every week and opens a pull request for review.
# Requires repository secret: ANTHROPIC_API_KEY
#
# To publish automatically instead of opening a PR for review, replace the
# "Create pull request" step with a direct commit + push to the default branch
# (see the commented block at the bottom of this file).

on:
  schedule:
    # 00:00 UTC every Monday (= 09:00 JST Monday).
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run blog:generate

      - name: Verify build
        if: steps.generate.outputs.created == 'true'
        run: npm run build

      - name: Create pull request
        if: steps.generate.outputs.created == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: blog/weekly-${{ steps.generate.outputs.slug }}
          commit-message: "blog: ${{ steps.generate.outputs.title }}"
          title: "新しいブログ記事: ${{ steps.generate.outputs.title }}"
          body: |
            自動生成された週次ブログ記事です。内容を確認のうえマージしてください。

            - slug: `${{ steps.generate.outputs.slug }}`
            - 追加ファイル: `src/data/blog-posts.ts`、`public/sitemap.xml`

            公開せずに破棄する場合は、このPRをそのままクローズしてください。
          add-paths: |
            src/data/blog-posts.ts
            public/sitemap.xml

